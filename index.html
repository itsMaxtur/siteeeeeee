<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Готова?</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #ff69b4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Comic Sans MS", "Segoe UI", Arial, sans-serif;
      user-select: none;
    }

    h1 {
      color: #fff;
      font-size: 4rem;
      text-shadow: 2px 2px 0 #d63384;
      margin-bottom: 40px;
      text-align: center;
    }

    button {
      font-family: inherit;
      font-size: 2rem;
      padding: 15px 70px;
      border: 3px solid #d63384;
      border-radius: 50px;
      background-color: #fff;
      color: #d63384;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }

    button:hover {
      background-color: #d63384;
      color: #fff;
      transform: scale(1.08);
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <h1>готова?</h1>
  <button type="button" onclick="window.location.href = 'scream.html'">да</button>
</body>
</html>
